<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOFIT - Búsqueda de Comida</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #map { height: 350px; width: 100%; border-radius: 8px; margin-top: 15px; }
        .card { border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; background-color: #f9f9f9; }
        .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>GEOFIT: Encuentra opciones de comida cerca de la USM</h2>
    
    <div class="controls">
        <label for="presupuesto">Presupuesto máximo ($):</label>
        <input type="number" id="presupuesto" value="5000" step="500">
        <button onclick="buscarLocalizaciones()">Buscar</button>
    </div>

    <div id="map"></div>

    <h3>Opciones encontradas</h3>
    <div id="lista-resultados"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado en la USM San Joaquín por defecto
        let map = L.map('map').setView([-33.4883, -70.6151], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marcadores = [];

        // Obtener la ubicación real del usuario desde el navegador o tablet
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                let userLat = position.coords.latitude;
                let userLng = position.coords.longitude;
                L.marker([userLat, userLng]).addTo(map).bindPopup("<b>Tu posición actual</b>").openPopup();
                map.setView([userLat, userLng], 16);
            });
        }

        async function buscarLocalizaciones() {
            let presupuesto = document.getElementById('presupuesto').value;
            let response = await fetch(`/api/buscar/?presupuesto=${presupuesto}`);
            let data = await response.json();

            // Limpiar marcadores viejos del mapa
            marcadores.forEach(m => map.removeLayer(m));
            marcadores = [];

            let listaHTML = '';

            data.resultados.forEach(item => {
                // Agregar pin al mapa
                let marker = L.marker([item.latitud, item.longitud]).addTo(map)
                    .bindPopup(`<b>${item.lugar}</b><br>${item.plato} - $${item.precio}`);
                marcadores.push(marker);

                let nutInfo = item.info_nutricional 
                    ? `<small><strong>Nutrición:</strong> Calorías: ${item.info_nutricional.calorias} kcal | Proteínas: ${item.info_nutricional.proteinas}g</small>`
                    : `<small>Sin datos nutricionales específicos</small>`;

                listaHTML += `
                    <div class="card">
                        <h4>${item.lugar} — ${item.plato} ($${item.precio})</h4>
                        <p><strong>Dirección:</strong> ${item.direccion}</p>
                        <p><strong>Tipo:</strong> ${item.tipo_alimentacion}</p>
                        <p>${nutInfo}</p>
                    </div>
                `;
            });

            document.getElementById('lista-resultados').innerHTML = listaHTML;
        }

        // Ejecutar primera búsqueda automática al cargar
        buscarLocalizaciones();
    </script>
</body>
</html>
