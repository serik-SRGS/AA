cat << 'EOF' > mi_proyecto/templates/index.html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOFIT - Encuentra opciones de comida</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">GEOFIT</h1>
        <nav class="space-x-4 text-sm font-medium text-gray-600">
            <a href="#" class="hover:text-black">Inicio</a>
            <a href="#" class="text-black font-semibold">Buscar</a>
            <a href="#" class="hover:text-black">Sobre nosotros</a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <section class="md:col-span-5 lg:col-span-4 bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
            <div>
                <h2 class="text-xl font-bold text-gray-900">Busca alternativas</h2>
                <p class="text-sm text-gray-500 mt-1">Filtra por presupuesto, dieta y alérgenos cerca de la USM.</p>
            </div>

            <div>
                <label for="presupuesto" class="block text-sm font-semibold text-gray-700">Presupuesto máximo</label>
                <div class="mt-2 flex items-center gap-2">
                    <span class="text-gray-500">$</span>
                    <input type="number" id="presupuesto" value="5000" step="500" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-black focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo de alimentación</label>
                <select id="tipo_alimentacion" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-black focus:outline-none bg-white">
                    <option value="">Todos los tipos</option>
                    <option value="1">Vegano</option>
                    <option value="2">Vegetariano</option>
                    <option value="3">Sin Gluten</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Excluir Alérgeno</label>
                <select id="alergeno" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-black focus:outline-none bg-white">
                    <option value="">Ninguno</option>
                    <option value="mani">Maní</option>
                    <option value="lactosa">Lactosa</option>
                    <option value="gluten">Gluten</option>
                </select>
            </div>

            <button onclick="buscarLocalizaciones()" class="w-full bg-black text-white font-semibold py-2.5 rounded-lg hover:bg-gray-800 transition">
                Buscar alternativas
            </button>

            <div class="border-t border-gray-100 pt-4">
                <h3 class="text-md font-bold text-gray-900 mb-3" id="contador-resultados">Cargando locales...</h3>
                <div id="lista-resultados" class="space-y-3 max-h-96 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <section class="md:col-span-7 lg:col-span-8 bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col">
            <h2 class="text-lg font-bold text-gray-900 mb-3">Mapa interactivo - San Joaquín</h2>
            <div id="map" class="w-full h-[580px] rounded-lg border border-gray-200 z-0"></div>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([-33.4883, -70.6151], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        L.marker([-33.4883, -70.6151]).addTo(map).bindPopup("<b>USM Campus San Joaquín</b>").openPopup();

        // Diccionario para almacenar marcadores por ID
        let marcadores = {};

        function seleccionarLocal(id, lat, lng) {
            map.flyTo([lat, lng], 17, { duration: 1.2 });
            if (marcadores[id]) {
                marcadores[id].openPopup();
            }
        }

        async function buscarLocalizaciones() {
            let presupuesto = document.getElementById('presupuesto').value;
            let tipo = document.getElementById('tipo_alimentacion').value;
            let alergeno = document.getElementById('alergeno').value;

            let url = `/api/buscar/?presupuesto=${presupuesto}`;
            if (tipo) url += `&tipo=${tipo}`;
            if (alergeno) url += `&alergeno=${alergeno}`;

            try {
                let response = await fetch(url);
                let data = await response.json();

                // Limpiar marcadores antiguos
                Object.values(marcadores).forEach(m => map.removeLayer(m));
                marcadores = {};

                let listaHTML = '';
                document.getElementById('contador-resultados').innerText = `Se encontraron ${data.resultados.length} opciones`;

                if (data.resultados.length === 0) {
                    document.getElementById('lista-resultados').innerHTML = '<p class="text-sm text-gray-500">No se encontraron locales para este filtro.</p>';
                    return;
                }

                data.resultados.forEach(item => {
                    // Crear marcador en el mapa
                    let marker = L.marker([item.latitud, item.longitud]).addTo(map)
                        .bindPopup(`<b>${item.lugar}</b><br>${item.plato} - $${item.precio}<br><small>${item.direccion}</small>`);
                    
                    marcadores[item.id] = marker;

                    let nutInfo = item.info_nutricional 
                        ? `<p class="text-xs text-gray-500 mt-1">Calorías: ${item.info_nutricional.calorias} kcal | Prot: ${item.info_nutricional.proteinas}g</p>`
                        : '';

                    listaHTML += `
                        <div onclick="seleccionarLocal(${item.id}, ${item.latitud}, ${item.longitud})" 
                             class="border border-gray-200 rounded-lg p-3 hover:border-black hover:bg-white cursor-pointer transition bg-gray-50 shadow-sm">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-sm text-gray-900">${item.lugar}</h4>
                                <span class="text-xs font-semibold bg-gray-200 text-gray-800 px-2 py-0.5 rounded">$${item.precio}</span>
                            </div>
                            <p class="text-xs font-medium text-gray-700 mt-1">${item.plato}</p>
                            <p class="text-[11px] text-gray-400 mt-0.5">${item.direccion}</p>
                            <span class="inline-block mt-2 text-[10px] font-medium bg-green-100 text-green-800 px-2 py-0.5 rounded-full">${item.tipo_alimentacion}</span>
                            ${nutInfo}
                        </div>
                    `;
                });

                document.getElementById('lista-resultados').innerHTML = listaHTML;

            } catch (error) {
                console.error("Error cargando alternativas:", error);
            }
        }

        buscarLocalizaciones();
    </script>
</body>
</html>
EOF
